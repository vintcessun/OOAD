server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/secrets/tls.crt;
    ssl_certificate_key /run/secrets/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location = /version {
        access_log off;
        default_type text/plain;
        return 200 "course-project-frontend\n";
    }
    location ~ ^/actuator(/|$) { return 404; }
    location ~ ^/(integration|identity)(/|$) { return 403; }
    location ~ ^/(auth|\.well-known)(/|$) {
        proxy_pass http://rbac-backend:${RBAC_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Audit-Service-Key "";
    }
    location ~ ^/(api/)?login$ {
        rewrite ^/api/login$ /login break;
        proxy_pass http://course-backend:${COURSE_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Audit-Service-Key "";
        proxy_set_header Authorization "";
    }
    location = /api/v1 { return 404; }
    location = /api { return 308 /api/; }
    location ^~ /api/v1/ { return 404; }
    location /api/ {
        proxy_pass http://rbac-backend:${RBAC_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Audit-Service-Key "";
        client_max_body_size 10m;
    }
    location ^~ /course/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
    }
    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
