server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 接口转发到权限中心（编排文件里的服务名），并把客户端地址带过去：审计日志的「在哪里」取 X-Forwarded-For
    location /api/ {
        proxy_pass http://rbac-structured:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 40m;
        proxy_read_timeout 600s;
    }

    # 前端路由用 history 模式：任何页面地址都回到 index.html，由 Vue Router 处理
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
