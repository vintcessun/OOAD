# OOAD: four services. Build and deploy from package; application tasks use
# rbac.role=app (project/monitor), data tasks use rbac.role=data (mysql).
# stack.sh loads .env. The stack creates its own rbac_default overlay network.
version: "3.8"

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: rbac
      MYSQL_USER: rbac
      MYSQL_PASSWORD: ${DB_PASSWORD:-rbac}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.rbac.role == data]
      resources:
        reservations: { memory: 800M }
        limits: { memory: 900M }

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.rbac.role == data]
      resources:
        reservations: { memory: 128M }
        limits: { memory: 200M }

  rbac-structured:
    image: ${REGISTRY:-}rbac-structured:${TAG:-latest}
    build:
      context: .
      args: { MODULE: rbac-structured }
    environment:
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-rbac}
      REDIS_HOST: redis
      RBAC_JWT_SECRET: ${RBAC_JWT_SECRET:-dev-only-secret-change-me-at-least-32-bytes!!}
      RBAC_INITIAL_PASSWORD: ${RBAC_INITIAL_PASSWORD:-Init@2026}
      JAVA_OPTS: ${APP_JAVA_OPTS:--Xms256m -Xmx512m -XX:+UseG1GC}
    depends_on: [mysql, redis]
    restart: on-failure
    deploy:
      replicas: ${APP_REPLICAS:-1}
      placement:
        constraints: [node.labels.rbac.role == app]
      restart_policy: { condition: on-failure, delay: 10s }
      resources:
        reservations: { memory: 700M }
        limits: { memory: 800M }

  rbac-web:
    image: ${REGISTRY:-}rbac-web:${TAG:-latest}
    build:
      context: ./rbac-web
    ports:
      - "80:80"
    depends_on: [rbac-structured]
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.rbac.role == app]
      resources:
        reservations: { memory: 64M }
        limits: { memory: 128M }

volumes:
  mysql-data:
