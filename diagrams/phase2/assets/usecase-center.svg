<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-label="01 / 权限中心总体用例图"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#21796c" stroke-width="1.5"/></marker><marker id="filled" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#21796c"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;fill:#18322f} .mono{font-family:Consolas,'Courier New',monospace} .edge{fill:none;stroke:#21796c;stroke-width:1.5} .label{paint-order:stroke;stroke:#faf9f4;stroke-width:7;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#faf9f4"/><rect x="0" width="9" height="100%" fill="#21796c"/><text x="44" y="49" font-size="28" font-weight="bold" style="fill:#18322f" >01 / 权限中心总体用例图</text><text x="45" y="80" font-size="15" font-weight="normal" style="fill:#62736e" >UML 用例视角 · 矩形为系统边界，椭圆为用户目标，实线为参与关系；管理能力受实际权限限制</text><rect x="260" y="125" width="975" height="925" rx="10" fill="#e9f3ee" stroke="#21796c"/><text x="288" y="160" font-size="21" font-weight="bold" style="fill:#18322f" >统一身份与权限中心（结构化 / DDD 二选一）</text><polyline points="130,265 215,230 285,230" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,265 200,185 990,185 990,191" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 225,365 285,365" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 235,305 990,305 990,326" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 225,500 285,500" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 235,440 990,440 990,461" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 225,635 285,635" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 235,575 990,575 990,596" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 225,770 285,770" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="130,605 235,710 990,710 990,731" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1370,610 1290,770 1195,770" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1370,920 1290,845 490,845 490,876" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><polyline points="1370,920 1280,915 1195,915" fill="none" stroke="#b8c7bf" stroke-width="1.4"/><ellipse cx="490" cy="230" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="236" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">登录、退出与修改密码</text><ellipse cx="990" cy="230" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="236" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">查看本人资料与有效权限</text><ellipse cx="490" cy="365" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="371" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">登记和启停受管系统</text><ellipse cx="990" cy="365" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="371" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">管理用户与部门</text><ellipse cx="490" cy="500" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="506" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">管理角色、权限与继承</text><ellipse cx="990" cy="500" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="506" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">配置准入、指派和回收角色</text><ellipse cx="490" cy="635" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="641" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">登记菜单、按钮和 API</text><ellipse cx="990" cy="635" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="641" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">维护 UI / API 映射</text><ellipse cx="490" cy="770" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="776" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">检查权限并解释授权来源</text><ellipse cx="990" cy="770" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="776" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">查询管理操作审计</text><ellipse cx="490" cy="915" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="490" y="921" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">查询身份及 UI / API 准入</text><ellipse cx="990" cy="915" rx="205" ry="39" fill="white" stroke="#21796c" stroke-width="1.5"/><text x="990" y="921" font-size="17" font-weight="normal" style="fill:#18322f" text-anchor="middle">写入 / 查询课程审计及私有服务接口</text><circle cx="110" cy="230" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M110 245v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="110" y="346" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">已认证用户</text><text x="110" y="370" font-size="12" font-weight="normal" style="fill:#62736e" text-anchor="middle">登录入口允许匿名访问</text><circle cx="110" cy="570" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M110 585v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="110" y="686" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">权限管理员</text><text x="110" y="710" font-size="12" font-weight="normal" style="fill:#62736e" text-anchor="middle">总部 / 部门授权范围</text><circle cx="1390" cy="575" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M1390 590v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="1390" y="691" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">审计查看者</text><text x="1390" y="715" font-size="12" font-weight="normal" style="fill:#62736e" text-anchor="middle">实际以权限码控制</text><circle cx="1390" cy="885" r="15" fill="white" stroke="#18322f" stroke-width="2"/><path d="M1390 900v43m-30-28h60m-30 28l-25 33m25-33l25 33" stroke="#18322f" stroke-width="2" fill="none"/><text x="1390" y="1001" font-size="17" font-weight="bold" style="fill:#18322f" text-anchor="middle">课程后端 / 网关</text><text x="1390" y="1025" font-size="12" font-weight="normal" style="fill:#62736e" text-anchor="middle">受信任外部系统</text><text x="280" y="1003" font-size="15" font-weight="normal" style="fill:#62736e" >前端菜单控制与服务端鉴权分别执行；健康检查、公钥发现属于技术接口，不单列业务用例。</text><text x="45" y="1090" font-size="16" font-weight="normal" style="fill:#62736e" >说明：管理员、审计查看者均使用统一身份；图中参与者表示职责，不是新增固定角色。</text><text x="45" y="1115" font-size="16" font-weight="normal" style="fill:#62736e" >没有将“登录”机械地画成每个用例的 include；认证通常是管理用例的前置条件。</text></svg>