openapi: 3.0.3
info:
  title: RBAC1 统一授权中心
  version: 2.0.0
  description: 结构化与 DDD 后端的共享契约。业务管理接口返回 code=OK 包装，外部身份、审计与服务投影采用裸响应。错误响应包含稳定的字符串
    code。
servers:
- url: http://localhost:8081
  description: 结构化后端默认本地地址
- url: http://localhost:8082
  description: DDD 后端默认本地地址
security:
- bearerAuth: []
tags:
- name: 统一身份鉴权
- name: 系统管理
- name: 部门与角色准入
- name: 用户管理
- name: 角色与继承
- name: 权限管理
- name: 菜单与按钮
- name: API 登记与映射
- name: 鉴权与解释
- name: 统一身份审计
- name: 管理审计
- name: 可信服务接口
- name: 仪表盘与运行状态
paths:
  /auth/login:
    post:
      operationId: login
      summary: 登录
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 权限中心验证用户名与密码，为 `systems` 中指定的单一系统签发 JWT。可用系统包括管理中心 `rbac-center`
        和课程系统 `course-project-management`。JWT 携带身份和令牌状态所需的声明，角色与权限需通过对应接口查询。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVO'
              example:
                accessToken: eyJhbGciOiJSUzI1NiIsImtpZCI6InNzby0yMDI2In0.payload.signature
                tokenType: Bearer
                expiresIn: 7200
        '401':
          description: 凭据无效、账号不可用或目标系统不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: 身份认证失败
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-required-permission: PUBLIC
  /auth/logout:
    post:
      operationId: logout
      summary: 退出登录
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 权限中心持久化当前 JWT 的撤销记录，成功后该令牌失效。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: '@authenticated'
  /auth/me:
    get:
      operationId: getIdentityCurrentUser
      summary: 查询当前用户的身份与前端权限
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 根据 JWT 的 `aud` 返回当前用户、有效身份角色与 UI 权限。无学号或工号时 `no` 返回空字符串。
      security:
      - bearerAuth: []
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      responses:
        '200':
          description: 当前用户、角色与前端权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityCurrentUserVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: '@authenticated'
  /auth/departments:
    get:
      operationId: listIdentityDepartments
      summary: 查询统一身份部门列表
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 由学校统一身份认证提供。按层级查询组织架构：不传 parentId 返回根部门，传入 parentId 只返回该部门的直接子部门。界面可结合
        hasChildren 逐层展开。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
          maxLength: 100
        description: 按部门名称或部门编码模糊查询
      - name: parentId
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: 上级部门标识；不传时查询根部门，传入时查询该部门的直接子部门
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIdentityDepartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 需要课程系统令牌、`admin` 身份角色及 `TEC` API 权限（`PERMISSION_DENIED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '404':
          description: 指定部门不存在或已停用（`NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-required-permission: '@authenticated'
      x-required-audience: course-project-management
      x-required-role: admin
      x-course-permission: TEC
  /auth/departments/{departmentId}/users:
    parameters:
    - name: departmentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: 统一身份认证系统中的部门标识
    get:
      operationId: listIdentityDepartmentUsers
      summary: 查询统一身份部门成员
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 由学校统一身份认证提供。按工号、学号或姓名分页查询指定部门下的统一身份用户，不返回电话、邮箱等联系方式。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
          maxLength: 100
        description: 按姓名、工号或学号模糊查询
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 部门用户分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIdentityDepartmentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 需要课程系统令牌、`admin` 身份角色及 `TEC` API 权限（`PERMISSION_DENIED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 指定部门不存在或已停用（`NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: '@authenticated'
      x-required-audience: course-project-management
      x-required-role: admin
      x-course-permission: TEC
  /auth/audit-logs:
    get:
      operationId: queryIdentityAuditLogs
      summary: 查询课程审计日志
      tags:
      - 统一身份审计
      x-apifox-folder: 统一身份审计
      description: 从权限中心的持久化审计记录查询当前 `aud` 的课程审计日志，按操作者、对象或时间筛选。调用需用户令牌、服务密钥与 `audit:read`
        API 权限。课程业务范围由课程服务校验。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      parameters:
      - name: actor
        in: query
        schema:
          type: string
        description: 操作人姓名或工号模糊查询
      - name: actorId
        in: query
        schema:
          type: integer
        description: 操作人稳定 id 精确查询；允许筛选已删除用户的历史操作
      - name: target
        in: query
        schema:
          type: string
        description: 操作对象模糊查询
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: 起始时间（含）
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: 结束时间（含）
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: X-Audit-Service-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 可信课程后端服务密钥；不得提供给浏览器。
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageIdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 服务密钥无效（`AUDIT_SERVICE_REQUIRED`）或权限不足（`PERMISSION_DENIED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: audit:read
    post:
      operationId: writeIdentityAuditLog
      summary: 写入课程审计日志
      tags:
      - 统一身份审计
      x-apifox-folder: 统一身份审计
      description: 权限中心持久化课程审计日志。调用需用户令牌、服务密钥与 `audit:write` API 权限。`objectType` 须与
        `objectId` 前缀一致。同一 `requestId`、来源系统、用户及规范化内容的重试返回原记录。同一 `requestId` 对应不同内容或身份时返回
        `400 AUDIT_DUPLICATE_CONFLICT`。
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentityAuditWriteInput'
      responses:
        '201':
          description: 审计日志已写入；同一幂等键重试时返回原日志
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityAuditLog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 服务密钥无效（`AUDIT_SERVICE_REQUIRED`）或权限不足（`PERMISSION_DENIED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: audit:write
      parameters:
      - name: X-Audit-Service-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
        description: 可信课程后端服务密钥；不得提供给浏览器。
  /auth/permissions/{permission}:
    parameters:
    - name: permission
      in: path
      required: true
      description: 统一身份认证定义的前端菜单/按钮权限码
      schema:
        type: string
        maxLength: 128
        minLength: 1
    get:
      operationId: checkIdentityPermission
      summary: 检查当前用户的 UI 权限
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: '根据 JWT 的 `aud` 查询当前用户是否拥有指定 UI 权限。未知或无权时返回 `allowed: false`。'
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 单个权限校验结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionCheckVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-required-permission: '@authenticated'
  /auth/api-permissions/{operationId}:
    parameters:
    - name: operationId
      in: path
      required: true
      description: OpenAPI 中目标接口的 operationId
      schema:
        type: string
        minLength: 1
        maxLength: 128
    get:
      operationId: getApiAuthority
      summary: 检查当前用户的 API 调用资格
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: '根据 JWT 的 `aud` 和 `operationId` 查询当前用户调用目标 API 的全局资格。已登记但无权或操作已停用时返回
        `allowed: false`。查询 `rbac-center` 的 `getDashboard` 时同时检查仪表盘所需的三项 API 权限。课程对象级权限由课程业务接口继续校验。'
      security:
      - bearerAuth: []
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      responses:
        '200':
          description: 当前用户调用目标 API 的权限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiAuthorityCheckVO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: operationId 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: API_OPERATION_NOT_FOUND
                message: 没有找到对应的 API 操作。
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
      x-required-permission: '@authenticated'
  /auth/users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 1
      description: 学校统一身份认证系统中的用户标识
    get:
      operationId: lookupIdentityUser
      summary: 按统一身份标识查询用户
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 按稳定的 `subject` 查询活跃用户的姓名与学号或工号。无学号或工号时 `no` 返回空字符串。
      x-required-role: admin
      x-required-permission: '@authenticated'
      responses:
        '200':
          description: 统一身份用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityUser'
        '403':
          description: 需要课程系统令牌、`admin` 身份角色及 `TEC` API 权限（`PERMISSION_DENIED`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 用户不存在或未处于活跃状态（`IDENTITY_USER_NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-provider: unified-identity
      x-provider-name: 统一身份认证系统
      security:
      - bearerAuth: []
      x-required-audience: course-project-management
      x-course-permission: TEC
  /api/v1/me:
    get:
      operationId: getMe
      summary: 查询本人资料与有效权限
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: 返回当前登录用户的基本资料，以及在 JWT 的 `aud` 对应系统中的直接角色、有效角色、权限和权限来源。
      x-required-permission: '@authenticated'
      x-required-audience: '@current'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/MeVO'
                  timestamp: &id001
                    type: string
                    format: date-time
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
  /api/v1/auth/password:
    post:
      operationId: changePassword
      summary: 修改当前用户密码
      tags:
      - 统一身份鉴权
      x-apifox-folder: 统一身份鉴权
      description: '修改成功后返回 HTTP 200 和 `data: null`，此前签发给该用户的令牌失效。'
      x-required-permission: '@authenticated'
      x-required-audience: '@current'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
                    enum:
                    - null
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordInput'
      parameters: []
  /api/v1/systems:
    get:
      operationId: listSystems
      summary: 查询受管系统列表
      tags:
      - 系统管理
      x-apifox-folder: 系统管理
      description: 列出权限中心已登记的系统，返回各系统的编码、名称和启停状态。
      x-required-permission: rbac:system:view
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters: []
    post:
      operationId: createSystem
      summary: 注册受管系统
      tags:
      - 系统管理
      x-apifox-folder: 系统管理
      description: 以唯一的系统编码注册受管系统。新系统默认启用，随后可在该系统下配置角色、权限和资源。
      x-required-permission: rbac:system:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/SystemVO'
                  timestamp: *id001
                required:
                - code
                - message
                - data
                - timestamp
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCreateInput'
      parameters: []
  /api/v1/systems/{id}:
    patch:
      operationId: updateSystem
      summary: 修改系统名称
      tags:
      - 系统管理
      x-apifox-folder: 系统管理
      description: 按系统 ID 修改显示名称，并返回更新后的系统资料。系统编码用于 JWT `aud` 和系统级配置定位。
      x-required-permission: rbac:system:edit
      x-required-audience: rbac-center
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    enum:
                    - OK
