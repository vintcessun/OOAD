openapi: 3.0.3

# =============================================================================
# 权限管理系统 API 契约
#
# 本文件是接口的**唯一事实来源**。docs/04-api.md 与本文件不一致时以本文件为准。
#
# rbac-structured（:8081）与 rbac-oo（:8082）必须实现完全相同的契约——
# 这是它们可以共用一套前端、一套契约测试的前提，也是三范式对比实验
# 「行为等价」这一前置条件的技术保证。
# =============================================================================

info:
  title: 权限管理系统 API
  description: |
    市政工程公司统一授权中心。服务该公司 18 个业务系统的权限判定与配置。

    ## 迭代范围
    接口以 `x-iteration` 标注所属迭代：
    - `1` RBAC0（10/27 检查）—— 用户/角色/权限配置、组织架构、单次判定
    - `2` RBAC1（11/24 检查）—— 角色继承、数据范围生效、批量判定、权限解释、缓存
    - `3` RBAC2/3（12/22 检查）—— 约束体系、会话角色激活

    ## 两个易错的约定
    1. **判定为「拒绝」时 `code` 仍是 0**。调用方问「他能不能做」、系统答「不能」，
       这是一次成功的调用。HTTP 403 只用于「调用方自己无权调用本接口」。
    2. **401 与 403 严格区分**。401 = 不知道你是谁；403 = 知道你是谁但你不能做这件事。
  version: 0.1.0
  contact:
    name: OOAD 课程设计
    url: https://github.com/vintcessun/OOAD

servers:
  - url: http://localhost:8081/api/v1
    description: 结构化（面向功能）实现
  - url: http://localhost:8082/api/v1
    description: 面向对象实现

tags:
  - name: authz
    description: 授权服务（系统核心；调用量可达其余接口总和的万倍）
  - name: auth
    description: 认证
  - name: user
    description: 用户管理
  - name: role
    description: 角色管理
  - name: permission
    description: 权限与资源管理
  - name: org
    description: 组织架构
  - name: hierarchy
    description: 角色继承（迭代二）
  - name: constraint
    description: 约束管理（迭代三）
  - name: audit
    description: 审计日志
  - name: biz
    description: 受保护业务桩

security:
  - bearerAuth: []

# =============================================================================
# 错误码（机器可读，单一来源）
# =============================================================================
x-error-codes:
  0:     SUCCESS
  # 10xxx 通用
  10001: PARAM_INVALID
  10002: UNAUTHORIZED
  10003: FORBIDDEN
  10004: NOT_FOUND
  10005: RATE_LIMITED
  10006: SYSTEM_UNAVAILABLE
  # 20xxx 身份
  20001: USER_NOT_FOUND
  20002: CREDENTIAL_INVALID
  20003: USER_DISABLED
  20004: USER_LOCKED
  20005: USERNAME_DUPLICATED
  # 21xxx 角色
  21001: ROLE_NOT_FOUND
  21002: ROLE_CODE_DUPLICATED
  21003: ROLE_IN_USE
  21004: ROLE_DISABLED
  21005: ROLE_BUILTIN_IMMUTABLE
  # 22xxx 权限
  22001: PERMISSION_NOT_FOUND
  22002: PERMISSION_CODE_DUPLICATED
  22003: PERMISSION_IN_USE
  # 23xxx 继承
  23001: HIERARCHY_CYCLE_DETECTED
  23002: HIERARCHY_SELF_LOOP
  23003: HIERARCHY_DEPTH_EXCEEDED
  23004: HIERARCHY_DUPLICATED
  # 24xxx 约束
  24001: SSD_VIOLATION
  24002: CARDINALITY_VIOLATION
  24003: PREREQUISITE_VIOLATION
  24004: DSD_VIOLATION
  24005: CONSTRAINT_INEFFECTIVE
  # 25xxx 授权
  25001: MISSING_PERMISSION
  25002: SUBJECT_DISABLED
  25003: BATCH_SIZE_EXCEEDED
  25004: OUT_OF_DATA_SCOPE
  # 26xxx 业务桩
  26001: DOC_NOT_FOUND
  26002: DOC_STATE_INVALID
  26003: SELF_APPROVAL_FORBIDDEN
  26004: ATTENDANCE_NOT_FOUND
  # 27xxx 组织
  27001: DEPT_NOT_FOUND
  27002: DEPT_HAS_CHILDREN
  27003: DEPT_HAS_USERS
  27004: DEPT_CYCLE_DETECTED
  27005: MANAGER_NOT_IN_DEPT
  27006: IMPORT_VALIDATION_FAILED

paths:

  # ---------------------------------------------------------------------------
  # 授权服务
  # ---------------------------------------------------------------------------
  /authz/check:
    post:
      tags: [authz]
      summary: 单次权限校验
      description: |
        **系统的核心接口。** 其余所有接口的调用量总和，可能不及本接口的万分之一。

        性能目标：P95 < 20ms，P99 < 50ms，缓存命中率 ≥ 95%。
        数据库不可用时按「失败关闭」返回拒绝，绝不放行。
      operationId: checkAuthorization
      x-iteration: 1
      x-required-permission: authz:check:invoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthzRequest' }
      responses:
        '200':
          description: 判定完成（允许或拒绝都是成功的调用）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthzDecision' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /authz/batch-check:
    post:
      tags: [authz]
      summary: 批量权限校验
      description: |
        对同一主体校验多个（资源, 操作）。价值不在省网络往返，而在**只加载一次权限集合**。
        也是前端页面加载时的主力接口：一个页面十几个按钮各需一条权限，一次请求拿全。
        单次上限 100 条，超出返回 25003。
      operationId: batchCheckAuthorization
      x-iteration: 2
      x-required-permission: authz:check:invoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchAuthzRequest' }
      responses:
        '200':
          description: 判定完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/BatchAuthzDecision' }

  /authz/explain:
    post:
      tags: [authz]
      summary: 权限解释
      description: |
        在判定结果之外返回完整推导轨迹，用于回答「为什么许禄不能审批公文」。

        实现要点：与普通判定**共用同一条管道**，只是开启轨迹记录——避免「解释结果
        与实际判定不一致」这一常见缺陷。不走缓存快路径，开销约为普通判定的 20 倍，必须限流。
        需要独立权限，且不得泄露请求方本身无权查看的角色与权限名。
      operationId: explainAuthorization
      x-iteration: 2
      x-required-permission: authz:explain:invoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthzRequest' }
      responses:
        '200':
          description: 判定与解释
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ExplainResult' }

  /authz/cache/invalidate:
    post:
      tags: [authz]
      summary: 手动失效权限缓存
      x-iteration: 2
      x-required-permission: system:perm:grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:    { type: string, enum: [USER, ROLE, ALL] }
                targetId: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /authz/cache/stats:
    get:
      tags: [authz]
      summary: 缓存统计
      x-iteration: 2
      responses:
        '200':
          description: 命中率、条目数、平均重建耗时
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CacheStats' }

  # ---------------------------------------------------------------------------
  # 认证
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: |
        失败一律返回 20002 CREDENTIAL_INVALID，**不区分用户不存在与口令错误**（防用户名枚举）。
        连续失败 5 次锁定 15 分钟。响应时间需与成功时相近，防止时序侧信道。
      operationId: login
      x-iteration: 1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: SG000013 }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      x-iteration: 1
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户信息与有效权限
      x-iteration: 1
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: 修改本人口令
      x-iteration: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------------------------------------------------------------------
  # 用户
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [user]
      summary: 用户列表
      x-iteration: 1
      x-required-permission: system:user:list
      parameters:
        - { name: keyword,        in: query, schema: { type: string },  description: 用户名或姓名模糊匹配 }
        - { name: departmentId,   in: query, schema: { type: integer, format: int64 } }
        - { name: includeSubDept, in: query, schema: { type: boolean, default: false }, description: 是否含下属部门 }
        - { name: position,       in: query, schema: { type: string } }
        - { name: roleId,         in: query, schema: { type: integer, format: int64 } }
        - { name: status,         in: query, schema: { type: integer, enum: [0, 1] } }
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 分页用户列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PageData'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [user]
      summary: 新增用户
      x-iteration: 1
      x-required-permission: system:user:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateRequest' }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [user]
      summary: 用户详情
      x-iteration: 1
      x-required-permission: system:user:list
      responses:
        '200':
          description: 用户详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [user]
      summary: 修改用户信息
      description: 不允许通过本接口修改口令与状态——各有专用接口，便于审计区分。
      x-iteration: 1
      x-required-permission: system:user:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                realName:     { type: string }
                departmentId: { type: integer, format: int64 }
                position:     { type: string }
                phone:        { type: string }
                email:        { type: string, format: email }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [user]
      summary: 删除用户（逻辑删除）
      x-iteration: 1
      x-required-permission: system:user:delete
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/status:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    patch:
      tags: [user]
      summary: 启用/禁用用户
      description: 禁用后立即失效其全部会话与权限缓存；不得禁用最后一个持有 SYS_ADMIN 的运维账号。
      x-iteration: 1
      x-required-permission: system:user:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: integer, enum: [0, 1] }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /users/{id}/roles:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [role]
      summary: 用户的角色列表
      x-iteration: 1
      x-required-permission: system:user:list
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [role]
      summary: 为用户分配角色
      description: |
        RBAC 模型的核心写操作，也是所有约束规则的主要拦截点。

        **幂等**：重复分配同一角色不视为错误。批量分配采用「全部成功或全部回滚」语义。
        提交后触发缓存失效（**事务提交后**发布事件，见 docs/02-architecture.md §4.2）。
      operationId: assignRolesToUser
      x-iteration: 1
      x-required-permission: system:role:assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleIds]
              properties:
                roleIds: { type: array, items: { type: integer, format: int64 } }
                reason:  { type: string, description: 变更原因，写入审计 }
      responses:
        '200':
          description: 分配成功，返回权限变更 diff
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AssignResult' }
        '409':
          description: 违反约束（迭代三起）。携带结构化冲突详情，使前端可提供修复操作。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConstraintViolation' }

  /users/{userId}/roles/{roleId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: roleId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [role]
      summary: 撤销用户角色
      description: 幂等。迭代三需反查先决条件约束——撤销可能使用户失去其它角色的前置条件。
      x-iteration: 1
      x-required-permission: system:role:revoke
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /users/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [user]
      summary: 用户的有效权限及来源
      description: |
        普通系统只回答「他有哪些权限」，本接口回答「他**为什么**有这些权限」。

        角色继承引入后，管理员面对一个拥有数百条权限的用户时，唯一能理解这些权限
        来源的途径就是这张溯源表。`managedDepartments` 来自部门表的反查，是 DEPT
        数据范围的实际作用域——没有它，「部门经理的数据范围」就是一句无法验证的话。
      x-iteration: 1
      x-required-permission: system:user:list
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [ALL, DIRECT, INHERITED], default: ALL } }
        - { name: systemCode, in: query, schema: { type: string }, description: 按软件系统筛选（权限可达数百条，必须可筛选） }
      responses:
        '200':
          description: 有效权限与来源
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EffectivePermissions' }

  # ---------------------------------------------------------------------------
  # 角色
  # ---------------------------------------------------------------------------
  /roles:
    get:
      tags: [role]
      summary: 角色列表
      description: 列表须含用户数、权限数、父角色数、状态。
      x-iteration: 1
      x-required-permission: system:role:list
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status,  in: query, schema: { type: integer, enum: [0, 1] } }
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [role]
      summary: 创建角色
      description: roleCode 全局唯一且创建后不可修改；roleName 可修改。
      x-iteration: 1
      x-required-permission: system:role:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode, roleName]
              properties:
                roleCode:    { type: string, example: DOC_REVIEWER }
                roleName:    { type: string, example: 公文复核员 }
                description: { type: string }
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [role]
      summary: 角色详情
      x-iteration: 1
      x-required-permission: system:role:list
      responses:
        '200':
          description: 角色详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
    put:
      tags: [role]
      summary: 修改角色
      x-iteration: 1
      x-required-permission: system:role:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName:    { type: string }
                description: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [role]
      summary: 删除角色
      description: |
        **已被用户持有、被其他角色继承、或被约束引用的角色不得删除**，须先解除引用。
        静默级联删除会造成不可预期的权限丢失；强制显式解除使影响面可见。
        被引用时返回 409 并附各类引用的数量与整改提示。
      x-iteration: 1
      x-required-permission: system:role:delete
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409':
          description: 角色正在被使用
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RoleInUseDetail' }

  /roles/{id}/permissions:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [permission]
      summary: 角色的权限（区分直接/继承）
      x-iteration: 1
      x-required-permission: system:role:list
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RolePermissions' }
    post:
      tags: [permission]
      summary: 为角色授予权限
      description: |
