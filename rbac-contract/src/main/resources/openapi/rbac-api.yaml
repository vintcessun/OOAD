  # ---------------------------------------------------------------------------
  # 约束（迭代三）
  # ---------------------------------------------------------------------------
  /constraints:
    get:
      tags: [constraint]
      summary: 约束列表
      x-iteration: 3
      x-required-permission: system:constraint:manage
      parameters:
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ConstraintType' } }
      responses:
        '200':
          description: 约束列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Constraint' } }
    post:
      tags: [constraint]
      summary: 创建约束
      description: |
        创建时**强制做存量冲突扫描**：系统里往往已存在违反新约束的数据，直接创建会让
        这些用户处于「不合规但系统不管」的静默状态。把存量检查做成创建流程的必经步骤，
        管理员就必须对存量数据做出明确处置。

        **互斥角色对不得存在继承关系**：若 A 继承 B 而规则声明 A⟂B，则任何持有 A 的
        用户都会因继承获得 B 而违反该约束——该约束不可满足，返回 24005。
      x-iteration: 3
      x-required-permission: system:constraint:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConstraintCreateRequest' }
      responses:
        '200':
          description: 创建成功，附存量冲突报告
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConstraintCreateResult' }
        '409': { $ref: '#/components/responses/Conflict' }

  /constraints/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      tags: [constraint]
      summary: 修改约束
      x-iteration: 3
      x-required-permission: system:constraint:manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConstraintCreateRequest' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [constraint]
