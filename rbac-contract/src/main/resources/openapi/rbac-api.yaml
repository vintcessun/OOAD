components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details: {}
      required:
      - code
      - message
    Page:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          example: 20
        total:
          type: integer
          example: 43
      additionalProperties: false
    Role:
      type: string
      description: 同一 User 可以同时拥有多个角色，例如 `teacher` 和 `admin`。组长是学生的子角色（`isLeader`），课程组长是教师的子角色（`isCourseLeader`）。
      enum:
      - student
      - teacher
      - admin
    UiPermission:
      type: string
      minLength: 1
      description: 统一身份认证定义的前端菜单/按钮权限码；不使用 AuthorityCodes，具体编码由统一身份认证维护
      example: course.view
    LoginInput:
      type: object
      required:
      - username
      - password
      - systems
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          description: RBAC1 用户账号
          pattern: \S
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: 由权限中心验证，数据库仅保存密码哈希。
          writeOnly: true
          pattern: \S
        systems:
          type: array
          minItems: 1
          uniqueItems: true
          description: 仅传一个已启用的系统编码，作为 JWT 的唯一 aud。
          items:
            type: string
            minLength: 1
            pattern: \S
          example:
          - course-project-management
          maxItems: 1
      additionalProperties: false
    LoginVO:
      type: object
      required:
      - accessToken
      - tokenType
      - expiresIn
      properties:
        accessToken:
          type: string
          description: 统一身份认证签发的 JWT 访问令牌；格式为 header.payload.signature，只用于身份认证，不包含
            identity、roles 或 permissions
        tokenType:
          type: string
          enum:
          - Bearer
        expiresIn:
          type: integer
          minimum: 1
          description: 令牌有效期，单位秒
          example: 7200
      additionalProperties: false
    PermissionCheckVO:
      type: object
      required:
      - allowed
      properties:
        allowed:
          type: boolean
          description: 当前用户是否具备路径中指定的前端菜单/按钮权限
          example: true
      additionalProperties: false
    IdentityCurrentUserVO:
      type: object
      description: 统一身份认证系统返回的当前用户身份、角色与前端权限
      required:
      - subject
      - roles
      - permissions
      - name
      - 'no'
      properties:
        subject:
          type: string
          description: 统一身份用户标识，对应 JWT `sub`
          example: sso-u1001
        roles:
          type: array
          description: 统一身份系统中的角色；同一自然人可以同时拥有教师和管理员角色
          items:
            $ref: '#/components/schemas/Role'
          example:
          - teacher
          - admin
        permissions:
          type: array
          description: 统一身份认证定义的前端菜单/按钮权限码，不使用 AuthorityCodes；后端仍由 Service 做强权限校验
          items:
            $ref: '#/components/schemas/UiPermission'
          example:
          - CV
          - CR
          - CE
        name:
          type: string
          example: 张小雨
        'no':
          type: string
          description: 学号或工号
          example: '20220101'
      additionalProperties: false
    ApiAuthorityCheckVO:
      type: object
      required:
      - operationId
      - allowed
      properties:
        operationId:
          type: string
          example: listAdminCourses
        allowed:
          type: boolean
          description: 当前用户是否具备调用目标 API 所需的全局 AuthorityCodes 权限；不返回权限码
          example: true
      additionalProperties: false
    AuditLog:
      type: object
      description: 统一身份系统审计日志的只读代理返回；本系统不持久化日志、不建立审计日志表。
      properties:
        id:
          type: integer
          example: 1
        at:
          type: string
          format: date-time
        actor:
          type: object
          properties:
            id:
