openapi: 3.0.3

# =============================================================================
# 权限中心 API 契约（RBAC0）
#
# 本文件是接口的唯一事实来源，docs/04-api.md 是它的说明。
# 每个操作都声明 x-required-permission，运行时拦截器只认这里：
#   - 权限码（如 rbac:user:view）：调用判定过程，没有该权限 → 403；
#   - "@self"：登录即可，能操作谁由 Service 判断（本人，或在管理范围内的人）；
#   - security: []：免登录，只有登录接口。
# 启动时双向核对：代码里有而这里没声明的路由、这里有而代码没实现的接口，任何一边存在都拒绝启动。
# =============================================================================

info:
  title: 权限中心 API
  description: |
    市政公司统一授权中心（RBAC0：用户 — 角色 — 权限 = 资源 × 操作）。

    ## 约定
    1. 统一响应 `{code, message, data, timestamp}`，`code = 0` 为成功。
    2. 401 = 未认证；403 = 已认证但无操作权限或目标超出管理范围；404 = 目标不存在；
       409 = 重复或状态冲突；400 = 参数不合法。
    3. 鉴权接口判定为「无权限」时返回 **200 + allowed=false**：那是一次正常完成的判定，
       不能与「调用者自己无权调用鉴权接口」（403）混淆。
  version: 1.0.0

servers:
  - url: http://localhost:8081/api/v1

tags:
  - name: auth
    description: 登录场景
  - name: authz
    description: 鉴权场景（业务系统调用）与权限解释
  - name: user
    description: 用户管理与用户角色指派
  - name: role
    description: 角色管理、角色权限、批量授权
  - name: permission
    description: 资源、操作、权限
  - name: menu
    description: 菜单管理与动态菜单
  - name: org
    description: 组织浏览与数据导入
  - name: stats
    description: 审计日志、Dashboard、权限使用热力图

security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      summary: 登录
      description: 失败一律返回「用户名或口令错误」；连续失败 5 次锁定 15 分钟（计数在数据库中原子累加）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, example: root }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      description: 令牌编号登记到 Redis，令牌原本到期前一直被拒绝。
      x-required-permission: "@self"
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [auth]
      summary: 当前用户的基本信息、角色与有效权限
      x-required-permission: "@self"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password:
    post:
      tags: [auth]
      summary: 修改本人口令
      description: 成功后此前签发的令牌全部失效。首次登录必须先调用本接口。
      x-required-permission: "@self"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string, format: password }
                newPassword: { type: string, format: password, description: 至少 8 位，含大写、小写、数字与特殊字符 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ authz
  /authz/check:
    post:
      tags: [authz]
      summary: 鉴权：某用户能否对某部门的数据执行某操作
      description: |
        查自己：任何已登录用户都可以。查别人（业务系统代用户鉴权）：调用者必须在被查用户所在部门持有
        rbac:authz:invoke，否则 403。每次判定记 AUTH_SUCCESS / AUTH_FAILED。
      x-required-permission: "@self"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthzRequest' }
      responses:
        '200':
          description: 判定完成（allowed 可能为 false）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/Decision' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /authz/explain:
    post:
      tags: [authz]
      summary: 权限解释：与 check 相同的判定，另返回逐步的判定依据（trace）
      description: 查别人需要在被查用户所在部门持有 rbac:authz:explain。
      x-required-permission: "@self"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthzRequest' }
      responses:
        '200':
          description: 判定完成
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/Decision' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ user
  /users:
    get:
      tags: [user]
      summary: 用户列表与搜索（只返回管理范围内的用户）
      x-required-permission: rbac:user:view
      parameters:
        - { name: keyword, in: query, schema: { type: string }, description: 匹配用户名、姓名、工号 }
        - { name: departmentId, in: query, schema: { type: integer, format: int64 } }
        - { name: includeDescendants, in: query, schema: { type: boolean, default: true } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' }, description: 默认不含已删除 }
        - { name: userType, in: query, schema: { $ref: '#/components/schemas/UserType' } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - properties:
                              items: { type: array, items: { $ref: '#/components/schemas/User' } }
    post:
      tags: [user]
      summary: 新增用户（正式员工或临时用户）
      description: 临时用户没有工号、电话，必须给出到期时间。目标部门必须在管理范围内。
      x-required-permission: rbac:user:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUser' }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/batch-status:
    post:
      tags: [user]
      summary: 批量启用 / 停用 / 删除
      description: 逐个校验，通过的执行，失败的逐人返回原因。
      x-required-permission: rbac:user:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds, status]
              properties:
                userIds: { type: array, items: { type: integer, format: int64 } }
                status: { $ref: '#/components/schemas/UserStatus' }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/BatchOk' }

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [user]
      summary: 用户详情：基本信息、角色、有效权限
      description: 本人可查自己；查别人需要在其部门持有 rbac:user:view。
      x-required-permission: "@self"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/UserDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [user]
      summary: 修改用户（姓名、部门、电话、岗位、到期时间）
      x-required-permission: rbac:user:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUser' }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [user]
      summary: 删除用户（逻辑删除，用户名不可复用，指派保留供审计）
      x-required-permission: rbac:user:delete
      parameters:
        - { name: reason, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [user]
      summary: 启用或停用
      x-required-permission: rbac:user:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
                reason: { type: string }
      responses:
        '200': { $ref: '#/components/responses/UserOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/roles:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [user]
      summary: 用户的角色指派
      x-required-permission: "@self"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
    post:
      tags: [user]
      summary: 为用户分配角色（ROLE_ASSIGN）
      description: |
        校验：用户与适用部门都在管理范围内；适用部门与用户同公司；超级管理员角色只有超级管理员能分配；
        不能授出自己在适用部门没有的权限。
      x-required-permission: rbac:assignment:assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId: { type: integer, format: int64 }
                scopeDepartmentId: { type: integer, format: int64, description: 适用部门（含下级），默认用户所属部门 }
                reason: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/Assignment' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/roles/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: assignmentId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [user]
      summary: 回收一次角色指派（ROLE_REVOKE）
      description: 只删这一条；被回收者过去授给别人的指派不受影响。不能回收最后一个有效的超级管理员。
      x-required-permission: rbac:assignment:revoke
      parameters:
        - { name: reason, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /users/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [user]
      summary: 用户的有效权限（每条带来源角色与适用部门）
      x-required-permission: "@self"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }

  # ------------------------------------------------------------------ role
  /roles:
    get:
      tags: [role]
      summary: 角色列表：名称、编码、用户数、权限数、状态
      x-required-permission: rbac:role:view
      parameters:
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [ENABLED, DISABLED] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Role' } }
    post:
      tags: [role]
      summary: 新增角色
      description: companyId 为空 = 全局角色，只有超级管理员能建；否则需要在该公司根部门持有 rbac:role:create。
      x-required-permission: rbac:role:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleCode, roleName]
              properties:
                roleCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,63}$' }
                roleName: { type: string }
                description: { type: string }
                companyId: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/RoleOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [role]
      summary: 角色详情：基本信息与权限
      x-required-permission: rbac:role:view
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/RoleDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [role]
      summary: 修改角色名称、描述、启用停用
      description: 停用后持有者在下一次请求即失去该角色的权限。超级管理员角色不能停用。
      x-required-permission: rbac:role:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName: { type: string }
                description: { type: string }
                status: { type: string, enum: [ENABLED, DISABLED] }
      responses:
        '200': { $ref: '#/components/responses/RoleOk' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [role]
      summary: 删除角色（内置角色不能删；仍有人持有时 409）
      x-required-permission: rbac:role:delete
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  /roles/{id}/users:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [role]
      summary: 角色详情「用户」：持有该角色的指派
      x-required-permission: rbac:role:view
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - properties:
                              items: { type: array, items: { $ref: '#/components/schemas/Assignment' } }

  /roles/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [role]
      summary: 为角色授予权限（PERMISSION_ASSIGN）
      description: 不能授出自己没有的权限。已有的跳过。
      x-required-permission: rbac:grant:assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/RoleDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /roles/{id}/permissions/{permissionId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: permissionId, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [role]
      summary: 回收角色的一个权限（PERMISSION_REVOKE）
      x-required-permission: rbac:grant:revoke
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '404': { $ref: '#/components/responses/NotFound' }

  /assignments/batch:
    post:
      tags: [role]
      summary: 按分公司 / 部门 / 员工批量分配角色
      description: |
        默认 ATOMIC：先逐人做完整校验，有任何一人不通过就整批不写（committed=false），返回失败清单；
        PARTIAL：写入通过的，失败逐人给出原因。已持有相同指派的人计入 duplicated。
      x-required-permission: rbac:assignment:assign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchAssign' }
      responses:
        '200': { $ref: '#/components/responses/BatchOk' }

  /assignments/batch-revoke:
    post:
      tags: [role]
      summary: 按分公司 / 部门 / 员工批量回收角色
      description: scopeDepartmentId 为空时回收这些人持有的该角色的全部指派。规则同批量分配。
      x-required-permission: rbac:assignment:revoke
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BatchAssign' }
      responses:
        '200': { $ref: '#/components/responses/BatchOk' }

  # ------------------------------------------------------------------ permission
  /systems:
    get:
      tags: [permission]
      summary: 业务系统与功能模块（权限域）
      x-required-permission: rbac:permission:view
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /resources:
    get:
      tags: [permission]
      summary: 资源列表（BUSINESS 业务功能点 / MENU 菜单 / API 接口能力）
      x-required-permission: rbac:permission:view
      parameters:
        - { name: systemId, in: query, schema: { type: integer, format: int64 } }
        - { name: type, in: query, schema: { type: string, enum: [BUSINESS, MENU, API] } }
        - { name: keyword, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [permission]
      summary: 新增资源，并为给出的操作建立权限
      x-required-permission: rbac:permission:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleId, resourceCode, resourceName]
              properties:
                moduleId: { type: integer, format: int64 }
                resourceCode: { type: string, example: 'oa:doc:draft' }
                resourceName: { type: string }
                resourceType: { type: string, enum: [BUSINESS, MENU, API] }
                description: { type: string }
                actionCodes: { type: array, items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  /actions:
    get:
      tags: [permission]
      summary: 操作词汇表
      x-required-permission: rbac:permission:view
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /permissions:
    get:
      tags: [permission]
      summary: 权限列表（Permission = Resource × Action）
      x-required-permission: rbac:permission:view
      parameters:
        - { name: systemId, in: query, schema: { type: integer, format: int64 } }
        - { name: resourceId, in: query, schema: { type: integer, format: int64 } }
        - { name: keyword, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [permission]
      summary: 为已有资源新增一个操作的权限
      x-required-permission: rbac:permission:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resourceId, actionCode]
              properties:
                resourceId: { type: integer, format: int64 }
                actionCode: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  /permissions/heatmap:
    get:
      tags: [stats]
      summary: 权限使用热力图（业务系统 × 操作，成功鉴权次数）
      x-required-permission: rbac:heatmap:view
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 默认 7 天前 }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 默认现在 }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ------------------------------------------------------------------ menu
  /menus/me:
    get:
      tags: [menu]
      summary: 当前用户可见的菜单树（按「菜单资源:view」动态生成）
      x-required-permission: "@self"
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /menus:
    get:
      tags: [menu]
      summary: 完整菜单树
      x-required-permission: rbac:menu:view
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    post:
      tags: [menu]
      summary: 新增菜单
      x-required-permission: rbac:menu:create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMenu' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /menus/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [menu]
      summary: 修改菜单
      x-required-permission: rbac:menu:edit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMenu' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [menu]
      summary: 删除菜单（有子菜单时 409）
      x-required-permission: rbac:menu:delete
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------------------------ org
  /companies:
    get:
      tags: [org]
      summary: 公司列表（只含管理范围涉及的公司）
      x-required-permission: rbac:org:view
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /departments/tree:
    get:
      tags: [org]
      summary: 部门树（管理范围内的部门及通往它们的祖先）
      x-required-permission: rbac:org:view
      parameters:
        - { name: companyId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /imports/organization:
    post:
      tags: [org]
      summary: 导入部门信息表与员工信息表
      description: 不分配任何角色；无法唯一定位的行进入异常清单、不写入。可重复执行。
      x-required-permission: rbac:org:import
      parameters:
        - { name: companyCode, in: query, required: true, schema: { type: string } }
        - { name: companyName, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [departments, employees]
              properties:
                departments: { type: string, format: binary }
                employees: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ImportOk' }

  /imports/permissions:
    post:
      tags: [org]
      summary: 导入应用软件功能权限清单（业务系统、模块、资源、权限、五类角色模板）
      x-required-permission: rbac:permission:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { $ref: '#/components/responses/ImportOk' }

  # ------------------------------------------------------------------ stats
  /audit-logs:
    get:
      tags: [stats]
      summary: 审计日志：谁、什么时候、在哪里、对谁、做了什么、结果如何、为什么
      x-required-permission: rbac:audit:view
      parameters:
        - { name: eventType, in: query, schema: { type: string }, description: 'LOGIN、LOGOUT、AUTH_SUCCESS、AUTH_FAILED、ROLE_ASSIGN、ROLE_REVOKE、PERMISSION_ASSIGN、PERMISSION_REVOKE 等' }
        - { name: actor, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCESS, DENIED, FAILED] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /dashboard:
    get:
      tags: [stats]
      summary: Dashboard 十一项指标
      x-required-permission: rbac:dashboard:view
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data: { $ref: '#/components/schemas/Dashboard' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 0, minimum: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, default: 20, maximum: 200 }

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    UserOk:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  data: { $ref: '#/components/schemas/User' }
    RoleOk:
      description: 成功
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  data: { $ref: '#/components/schemas/Role' }
    BatchOk:
      description: 批量结果
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  data: { $ref: '#/components/schemas/BatchResult' }
    ImportOk:
      description: 导入报告
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponse'
              - properties:
                  data: { $ref: '#/components/schemas/ImportReport' }
    BadRequest:
      description: 参数不合法（code 40001）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Unauthorized:
      description: 未认证（40101 令牌无效 / 40102 用户名或口令错误 / 40103 已锁定 / 40104 已停用）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Forbidden:
      description: 无操作权限（40301）、超出管理范围（40302）、越权授予（40303）、须先改口令（40304）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    NotFound:
      description: 目标不存在（40401）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Conflict:
      description: 重复（40901）或状态冲突（40902）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }

  schemas:
    ApiResponse:
      type: object
      properties:
        code: { type: integer, example: 0 }
        message: { type: string }
        data: {}
        timestamp: { type: string, format: date-time }

    Page:
      type: object
      properties:
        items: { type: array, items: {} }
        total: { type: integer, format: int64 }
        page: { type: integer }
        size: { type: integer }

    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED, DELETED]

    UserType:
      type: string
      enum: [EMPLOYEE, TEMPORARY, SYSTEM]

    LoginResult:
      type: object
      properties:
        token: { type: string }
        expiresIn: { type: integer, description: 秒 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        realName: { type: string }
        mustChangePwd: { type: boolean }

    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        realName: { type: string }
        userType: { $ref: '#/components/schemas/UserType' }
        employeeNo: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        position: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/UserStatus' }
        statusReason: { type: string, nullable: true }
        companyId: { type: integer, format: int64 }
        departmentId: { type: integer, format: int64 }
        departmentName: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        mustChangePwd: { type: boolean }
        createdAt: { type: string, format: date-time }

    CreateUser:
      type: object
      required: [username, realName, departmentId]
      properties:
        username: { type: string }
        realName: { type: string }
        departmentId: { type: integer, format: int64 }
        userType: { $ref: '#/components/schemas/UserType' }
        employeeNo: { type: string, description: 正式员工必填；临时用户不能填 }
        phone: { type: string, description: 临时用户不能填 }
        position: { type: string }
        expiresAt: { type: string, format: date-time, description: 临时用户必填 }
        password: { type: string, description: 为空时使用初始口令并要求首次登录修改 }

    UpdateUser:
      type: object
      properties:
        realName: { type: string }
        departmentId: { type: integer, format: int64, description: 调入部门也必须在管理范围内，且不能跨公司 }
        phone: { type: string }
        position: { type: string }
        expiresAt: { type: string, format: date-time }

    Assignment:
      type: object
      description: 一次角色指派（用户 + 角色 + 适用部门）
      properties:
        assignmentId: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        username: { type: string }
        userRealName: { type: string }
        roleId: { type: integer, format: int64 }
        roleCode: { type: string }
        roleName: { type: string }
        roleStatus: { type: string }
        scopeDeptId: { type: integer, format: int64 }
        scopeDeptName: { type: string }
        scopePath: { type: string }
        scopeCompanyId: { type: integer, format: int64 }
        grantedBy: { type: integer, format: int64 }
        grantedAt: { type: string, format: date-time }
        reason: { type: string }

    EffectivePermission:
      type: object
      properties:
        permissionCode: { type: string }
        roleCode: { type: string }
        roleName: { type: string }
        scopeDeptId: { type: integer, format: int64 }
        scopeDeptName: { type: string }
        selfOnly: { type: boolean }

    UserDetail:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        roles: { type: array, items: { $ref: '#/components/schemas/Assignment' } }
        superAdmin: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/EffectivePermission' } }

    Role:
      type: object
      properties:
        id: { type: integer, format: int64 }
        roleCode: { type: string }
        roleName: { type: string }
        description: { type: string }
        status: { type: string, enum: [ENABLED, DISABLED] }
        builtin: { type: boolean }
        companyId: { type: integer, format: int64, nullable: true, description: 空 = 全局角色 }
        userCount: { type: integer, format: int64 }
        permissionCount: { type: integer, format: int64 }

    RoleDetail:
      type: object
      properties:
        role: { $ref: '#/components/schemas/Role' }
        permissions:
          type: array
          items:
            type: object
            properties:
              permissionId: { type: integer, format: int64 }
              permissionCode: { type: string }
              resourceName: { type: string }
              actionName: { type: string }
              selfOnly: { type: boolean }
              grantedAt: { type: string, format: date-time }

    BatchAssign:
      type: object
      required: [targetType, targetIds, roleId]
      properties:
        targetType: { type: string, enum: [COMPANY, DEPARTMENT, USER] }
        targetIds: { type: array, items: { type: integer, format: int64 } }
        includeDescendants: { type: boolean, default: true }
        roleId: { type: integer, format: int64 }
        scopeDepartmentId: { type: integer, format: int64, description: 为空 = 各自所属部门 }
        reason: { type: string }
        mode: { type: string, enum: [ATOMIC, PARTIAL], default: ATOMIC }

    BatchResult:
      type: object
      properties:
        mode: { type: string }
        committed: { type: boolean }
        requested: { type: integer }
        succeeded: { type: integer }
        duplicated: { type: integer }
        failed: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              userId: { type: integer, format: int64 }
              reason: { type: string, example: OUT_OF_MANAGE_SCOPE }

    AuthzRequest:
      type: object
      description: 主体用 userId 或 username 指定，都为空表示调用者本人；权限用 permission 或 resource + action 指定。
      properties:
        userId: { type: integer, format: int64 }
        username: { type: string }
        permission: { type: string, example: 'oa:m01:f02:approve' }
        resource: { type: string, example: 'oa:m01:f02' }
        action: { type: string, example: approve }
        targetDeptId: { type: integer, format: int64, description: 被操作数据所属部门；为空表示不涉及具体部门 }

    Decision:
      type: object
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          enum: [ROLE_GRANTED, SUPER_ADMIN_BYPASS, SUBJECT_NOT_FOUND, SUBJECT_DISABLED, SUBJECT_DELETED,
                 SUBJECT_EXPIRED, MISSING_PERMISSION, OUT_OF_DATA_SCOPE, TARGET_DEPT_NOT_FOUND]
        userId: { type: integer, format: int64 }
        username: { type: string }
        permissionCode: { type: string }
        targetDeptId: { type: integer, format: int64 }
        matched:
          type: object
          nullable: true
          description: 放行所依据的授权（角色 + 适用部门）
        selfOnly: { type: boolean, description: 只限本人记录，由业务系统按记录归属过滤 }
        cacheHit: { type: boolean }
        latencyUs: { type: integer, format: int64 }
        trace: { type: array, nullable: true, items: { type: string }, description: 仅解释接口返回 }

    SaveMenu:
      type: object
      required: [menuName]
      properties:
        parentId: { type: integer, format: int64 }
        resourceId: { type: integer, format: int64, description: 必须是 MENU 类型资源；为空表示目录 }
        menuName: { type: string }
        routePath: { type: string }
        componentKey: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }

    ImportReport:
      type: object
      properties:
        counts: { type: object, additionalProperties: { type: integer } }
        notes: { type: array, items: { type: string } }
        anomalies:
          type: array
          items:
            type: object
            properties:
              sheet: { type: string }
              row: { type: integer }
              reason: { type: string }
              value: { type: string }

    Dashboard:
      type: object
      description: 统计口径见 docs/05-ui.md §3.1
      properties:
        userCount: { type: integer, format: int64, description: 未删除的用户（含停用、临时） }
        roleCount: { type: integer, format: int64 }
        permissionCount: { type: integer, format: int64 }
        todayAuthzCount: { type: integer, format: int64 }
        successRate: { type: number }
        failureRate: { type: number }
        p95LatencyMs: { type: number }
        p99LatencyMs: { type: number }
        qps: { type: number, description: 最近 60 秒的鉴权次数 / 60 }
        cacheHitRate: { type: number }
        abnormalCount: { type: integer, format: int64 }
        generatedAt: { type: string, format: date-time }
