    post:
      tags: [biz]
      summary: 审批发文稿件
      description: |
        除功能权限校验外，还检查**拟稿人 ≠ 审批人**，违反返回 26003。

        这是业务级职责分离，与 RBAC 的 SSD 互补：SSD 管的是「同一用户不能同时拥有
