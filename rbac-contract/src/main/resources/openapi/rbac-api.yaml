      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved]
              properties:
                approved: { type: boolean }
                note:     { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /hr/attendance:
    get:
      tags: [biz]
      summary: 考勤记录列表
      description: |
        **数据范围功能最直观的验收用例**：同一个 URL、同一份代码，四个人看到四种结果。

        | 调用者 | data_scope | 返回 |
        |---|---|---|
        | 许禄（普通员工） | SELF | 仅本人 |
        | 袁国智（部门经理） | DEPT | 综合办公室 18 人 |
        | 曾禄（分公司负责人） | DEPT_AND_SUB | 该分公司及下属共 1120 人 |
        | 薛峰（公司领导） | ALL | 全部 10000 人 |
      x-iteration: 1
      x-required-permission: hr:attendance:record:view
      parameters:
        - { name: month,  in: query, schema: { type: string, example: '2026-09' } }
        - { name: userId, in: query, schema: { type: integer, format: int64 } }
        - { $ref: '#/components/parameters/PageNum' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: 考勤记录
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PageData' }

  /hr/attendance/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    put:
      tags: [biz]
      summary: 修改考勤记录
      description: 普通员工的 data_scope 为 SELF —— 只能改本人记录，改他人返回 25004。
      x-iteration: 2
      x-required-permission: hr:attendance:record:edit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkIn:  { type: string, format: date-time }
                checkOut: { type: string, format: date-time }
                remark:   { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }

# =============================================================================
components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT 载荷**只含身份标识与所属部门，不含权限列表**。

        JWT 一旦签发就无法撤销；若把权限写入其中，管理员撤销权限后用户在令牌有效期内
        仍持有旧权限，与「权限变更立即生效」直接冲突。因此权限每次在服务端实时查询
        （走缓存，约 0.1ms）——用极小的性能代价换取安全正确性。

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PageNum:
      name: pageNum
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  responses:
    Ok:
      description: 操作成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Forbidden:
      description: 已认证但无权限（403）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    NotFound:
      description: 资源不存在（404）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    Conflict:
      description: 冲突：唯一键重复、约束违反、状态冲突（409）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }
    ServiceUnavailable:
      description: |
        依赖不可用（503）。授权判定在此情况下按「**失败关闭**」返回拒绝，绝不放行。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiResponse' }

  schemas:

    # ---- 通用 ----
    ApiResponse:
      type: object
      required: [code, message]
      properties:
        code:      { type: integer, description: '0 = 成功；非 0 见 x-error-codes', example: 0 }
        message:   { type: string, example: success }
        data:      { description: 业务数据；无返回值时为 null }
        traceId:   { type: string, example: 7f3a9c2e1b84, description: 与审计日志的 trace_id 对应 }
        timestamp: { type: string, format: date-time }

    PageData:
      type: object
      properties:
        list:     { type: array, items: {} }
        total:    { type: integer, format: int64 }
        pageNum:  { type: integer }
        pageSize: { type: integer }

    DataScope:
      type: string
      description: |
        数据范围。来源：权限清单中 6 个功能点对「普通员工」标注为「查看本人」，
        证明仅有功能权限不足以描述需求。
      enum: [ALL, DEPT_AND_SUB, DEPT, SELF]
      default: ALL

    # ---- 授权 ----
    AuthzContext:
      type: object
      description: |
        判定上下文。**迭代一忽略其内容**，但字段从迭代一起就存在于协议中。

        若迭代一把接口定成 {subject, resource, action}，迭代二加 context 时所有已接入的
        业务系统都要改调用方、所有测试用例要改、契约要升版本。现在留一个恒被忽略的
        可选字段，成本为零——这是「提前把扩展点开在协议上」而非「提前实现功能」。
      properties:
        targetDeptId:     { type: integer, format: int64, description: 目标数据归属部门（迭代二 DEPT/DEPT_AND_SUB 用） }
        targetUserId:     { type: integer, format: int64, description: 目标数据归属人（迭代二 SELF 用） }
        targetResourceId: { type: string, description: 目标资源实例标识 }

    AuthzRequest:
      type: object
      required: [subject, resource, action]
      properties:
        subject:  { type: string, example: SG000013, description: '主体标识（用户名或 user_ + id）' }
        resource: { type: string, example: 'oa:doc:draft', description: '系统:模块:功能点' }
        action:   { type: string, example: approve, enum: [view, create, edit, approve, export] }
        context:  { $ref: '#/components/schemas/AuthzContext' }

    AuthzDecision:
      type: object
      required: [allowed]
      properties:
        allowed: { type: boolean }
        reason:
          type: string
          description: 拒绝原因；允许时为空
          enum: [MISSING_PERMISSION, SUBJECT_DISABLED, SUBJECT_INVALID, OUT_OF_DATA_SCOPE, DSD_VIOLATION, SYSTEM_UNAVAILABLE]
        requiredPermission: { type: string, example: 'oa:doc:draft:approve' }
        grantedScope:       { $ref: '#/components/schemas/DataScope' }
        subjectDeptId:      { type: integer, format: int64 }
        targetDeptId:       { type: integer, format: int64 }
        cached:             { type: boolean }
        elapsedMicros:      { type: integer, format: int64 }

    BatchAuthzRequest:
      type: object
      required: [subject, requests]
      properties:
        subject: { type: string }
        context: { $ref: '#/components/schemas/AuthzContext' }
        requests:
          type: array
          maxItems: 100
          items:
            type: object
            required: [resource, action]
            properties:
              resource: { type: string }
              action:   { type: string }

    BatchAuthzDecision:
      type: object
      properties:
        results:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  resource: { type: string }
                  action:   { type: string }
              - $ref: '#/components/schemas/AuthzDecision'
        elapsedMicros: { type: integer, format: int64 }

    ExplainResult:
      allOf:
        - $ref: '#/components/schemas/AuthzDecision'
        - type: object
          properties:
            subject:        { type: string }
            directRoles:    { type: array, items: { type: string } }
            effectiveRoles: { type: array, items: { type: string } }
            evaluationPath:
              type: array
              items: { type: string }
              example:
                - 'user:SG000013(许禄) -> role:EMPLOYEE (直接指派)'
                - 'role:EMPLOYEE -> permission:oa:doc:draft:view'
                - 'role:EMPLOYEE -> permission:oa:doc:draft:create'
                - 'oa:doc:draft:approve 未在任何有效角色中找到'
            suggestion: { type: string }

    CacheStats:
      type: object
      properties:
        hitRate:            { type: number, format: double }
        l1Entries:          { type: integer }
        l2Entries:          { type: integer }
        avgRebuildMicros:   { type: integer, format: int64 }
        invalidationsToday: { type: integer, format: int64 }

    # ---- 身份与组织 ----
    User:
      type: object
      properties:
        id:             { type: integer, format: int64 }
        username:       { type: string, example: SG000013 }
        realName:       { type: string, example: 许禄 }
        departmentId:   { type: integer, format: int64 }
        departmentName: { type: string, example: 综合办公室 }
        departmentPath: { type: string, example: 总公司 / 综合办公室 }
        position:       { type: string, example: 干事, description: 岗位；仅导入时派生初始角色，不参与鉴权 }
        phone:          { type: string }
        email:          { type: string }
        status:         { type: integer, enum: [0, 1] }
        mustChangePwd:  { type: boolean }
        roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
        createdAt:      { type: string, format: date-time }

    UserCreateRequest:
      type: object
      required: [username, realName]
      properties:
        username:     { type: string }
        realName:     { type: string }
        departmentId: { type: integer, format: int64 }
        position:     { type: string }
        phone:        { type: string }
        email:        { type: string, format: email }
        roleIds:      { type: array, items: { type: integer, format: int64 } }

    LoginResult:
      type: object
      properties:
        token:       { type: string }
        expiresIn:   { type: integer, description: 秒；默认 7200 }
        user:        { $ref: '#/components/schemas/User' }
        roles:       { type: array, items: { $ref: '#/components/schemas/Role' } }
        permissions: { type: array, items: { type: string }, description: 有效权限码集合 }
        dataScopes:
          type: object
          additionalProperties: { $ref: '#/components/schemas/DataScope' }
          description: |
            只列出**非 ALL** 的条目。全部列出会让一万名普通员工每次登录都下发
            几十条恒为 ALL 的冗余数据。
        menus: { type: array, items: { $ref: '#/components/schemas/Menu' } }

    Department:
      type: object
      properties:
        id:              { type: integer, format: int64 }
        deptName:        { type: string }
        parentId:        { type: integer, format: int64 }
        level:           { type: integer, minimum: 1, maximum: 3 }
        path:            { type: string, example: /1/22/23/ }
        manager:
          type: object
          properties:
            userId:   { type: integer, format: int64 }
            realName: { type: string }
        userCount:       { type: integer, description: 含下属部门的累计人数 }
        directUserCount: { type: integer, description: 直属人数；判断能否删除用 }
        children:        { type: array, items: { $ref: '#/components/schemas/Department' } }

    DepartmentTree:
      type: object
      properties:
        root:             { $ref: '#/components/schemas/Department' }
        totalDepartments: { type: integer, example: 111 }
        maxLevel:         { type: integer, example: 3 }

    # ---- 角色与权限 ----
    Role:
      type: object
      properties:
        id:              { type: integer, format: int64 }
        roleCode:        { type: string, example: DEPT_MANAGER }
        roleName:        { type: string, example: 部门经理 }
        description:     { type: string }
        status:          { type: integer, enum: [0, 1] }
        builtin:         { type: boolean }
        userCount:       { type: integer }
        permissionCount: { type: integer }
        parentRoleCount: { type: integer }

    RoleInUseDetail:
      type: object
      properties:
        userCount:       { type: integer }
        childRoleCount:  { type: integer }
        constraintCount: { type: integer }
        hint:            { type: string }

    SoftwareSystem:
      type: object
      properties:
        id:         { type: integer, format: int64 }
        systemCode: { type: string, example: oa }
        systemName: { type: string, example: OA协同办公系统 }
        modules:    { type: array, items: { $ref: '#/components/schemas/FunctionModule' } }

    FunctionModule:
      type: object
      properties:
        id:         { type: integer, format: int64 }
        moduleCode: { type: string, example: doc }
        moduleName: { type: string, example: 公文管理 }
        resources:  { type: array, items: { $ref: '#/components/schemas/Resource' } }

    Resource:
      type: object
      properties:
        id:           { type: integer, format: int64 }
        resourceCode: { type: string, example: draft }
        resourceName: { type: string, example: 发文拟稿与审核 }
        description:  { type: string, description: 权限清单的「功能说明」列 }

    Action:
      type: object
      properties:
        actionCode: { type: string, enum: [view, create, edit, approve, export] }
        actionName: { type: string }
        riskWeight: { type: integer, description: '风险权重：view=1 create=2 edit=3 export=5 approve=8' }

    Permission:
      type: object
      properties:
        id:             { type: integer, format: int64 }
        permissionCode: { type: string, example: 'oa:doc:draft:approve', description: '系统:模块:功能点:操作' }
        systemCode:     { type: string }
        moduleName:     { type: string }
        resourceName:   { type: string }
        actionCode:     { type: string }
        description:    { type: string }

    EffectivePermissions:
      type: object
      properties:
        user:           { $ref: '#/components/schemas/User' }
        directRoles:    { type: array, items: { $ref: '#/components/schemas/Role' } }
        inheritedRoles:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Role'
              - type: object
                properties:
                  via: { type: array, items: { type: string }, description: 经由哪些角色继承而来 }
        managedDepartments:
          type: array
          items: { $ref: '#/components/schemas/Department' }
          description: |
            该用户担任经理的部门。DEPT 数据范围的实际作用域——没有这个字段，
            「部门经理的数据范围」就是一句无法验证的话。
        permissions:
          type: array
          items:
            type: object
            properties:
              code:      { type: string }
              source:    { type: string, enum: [DIRECT, INHERITED] }
              fromRole:  { type: string }
              path:      { type: array, items: { type: string }, description: 继承路径 }
              dataScope: { $ref: '#/components/schemas/DataScope' }
        permissionCount: { type: integer }
        riskScore:       { type: integer, minimum: 0, maximum: 100 }

    RolePermissions:
      type: object
      properties:
        directPermissions:    { type: array, items: { $ref: '#/components/schemas/Permission' } }
        inheritedPermissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        effectivePermissions: { type: array, items: { $ref: '#/components/schemas/Permission' } }

    AssignResult:
      type: object
      properties:
        assigned: { type: array, items: { type: integer, format: int64 } }
        skipped:  { type: array, items: { type: integer, format: int64 }, description: 已存在的指派（幂等，不视为错误） }
        permissionDiff:
          type: object
          properties:
            added:   { type: array, items: { type: string } }
            removed: { type: array, items: { type: string } }
        affectedCacheKeys: { type: integer }

    GrantResult:
      type: object
      properties:
        granted:        { type: array, items: { type: integer, format: int64 } }
        skipped:        { type: array, items: { type: integer, format: int64 } }
        affectedUsers:  { type: integer, description: 受影响用户数（含经继承持有者） }

    # ---- 继承 ----
    HierarchyGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Role'
              - type: object
                properties:
                  directPermCount: { type: integer }
        edges:
          type: array
          items:
            type: object
            properties:
              childRoleId:  { type: integer, format: int64 }
              parentRoleId: { type: integer, format: int64 }
        maxDepth: { type: integer }
        hasCycle: { type: boolean }

    HierarchyChangeResult:
      type: object
      properties:
        affectedRoles:  { type: integer }
        affectedUsers:  { type: integer }
        newPermissions: { type: array, items: { type: string } }
        newDepth:       { type: integer }

    CycleDetail:
      type: object
      properties:
        cyclePath:
          type: array
          items: { $ref: '#/components/schemas/Role' }
          description: |
            构成环的完整角色路径。返回路径而非仅「存在环」——角色上百时管理员无法
            自行找出环在哪里，前端需要据此把构成环的边标红。

    # ---- 约束 ----
    ConstraintType:
      type: string
      enum:
        - SSD_MUTEX           # 静态互斥角色
        - DSD_MUTEX           # 动态互斥（会话级）
        - CARD_ROLE_USER_MAX  # 单角色可分配用户数上限
        - CARD_USER_ROLE_MAX  # 单用户可拥有角色数上限
        - CARD_ROLE_PERM_MAX  # 单角色可关联权限数上限
        - PREREQUISITE        # 先决条件角色
      description: 三类基数约束全部实现——课程课件明确列出这三项。

    Constraint:
      type: object
      properties:
        id:             { type: integer, format: int64 }
        constraintName: { type: string }
        constraintType: { $ref: '#/components/schemas/ConstraintType' }
        threshold:      { type: integer }
        targetRole:     { $ref: '#/components/schemas/Role' }
        roles:          { type: array, items: { $ref: '#/components/schemas/Role' } }
        enabled:        { type: boolean }
        legacyExempt:   { type: boolean, description: 存量豁免，仅拦截新增 }
        conflictCount:  { type: integer, description: 当前违反该约束的用户数 }

    ConstraintCreateRequest:
      type: object
      required: [constraintName, constraintType]
      properties:
        constraintName: { type: string }
        constraintType: { $ref: '#/components/schemas/ConstraintType' }
        threshold:      { type: integer }
        targetRoleId:   { type: integer, format: int64, description: 单角色类约束的目标；CARD_USER_ROLE_MAX 留空 }
        roleIds:        { type: array, items: { type: integer, format: int64 } }
        description:    { type: string }
        legacyMode:     { type: string, enum: [LEGACY_EXEMPT, REJECT_IF_CONFLICT], default: LEGACY_EXEMPT }

    ConstraintCreateResult:
      type: object
      properties:
        constraintId:    { type: integer, format: int64 }
        legacyConflicts: { $ref: '#/components/schemas/LegacyConflicts' }
        appliedMode:     { type: string }

    LegacyConflicts:
      type: object
      properties:
        count: { type: integer }
        samples:
          type: array
          maxItems: 100
          items:
            type: object
            properties:
              userId:           { type: integer, format: int64 }
              username:         { type: string }
              realName:         { type: string }
              conflictingRoles: { type: array, items: { type: string } }
        exportUrl: { type: string }

    ConstraintViolation:
      type: object
      properties:
        constraintName:   { type: string, example: 审计独立性 }
        constraintType:   { $ref: '#/components/schemas/ConstraintType' }
        conflictingRoles:
          type: array
          items:
            type: object
            properties:
              id:       { type: integer, format: int64 }
              roleCode: { type: string }
              roleName: { type: string }
              status:   { type: string, enum: [已拥有, 拟分配] }
              via:      { type: string, description: 'DIRECT 或继承来源；继承也可能间接导致互斥' }
        maxAllowed: { type: integer }
        suggestion: { type: string }

    WhatIfResult:
      type: object
      properties:
        wouldSucceed: { type: boolean }
        permissionDiff:
          type: object
          properties:
            added:   { type: array, items: { type: string } }
            removed: { type: array, items: { type: string } }
        violations: { type: array, items: { $ref: '#/components/schemas/ConstraintViolation' } }
        riskScoreChange:
          type: object
          properties:
            before: { type: integer }
            after:  { type: integer }
            level:  { type: string, enum: [LOW, MEDIUM, HIGH] }

    # ---- 其它 ----
    Menu:
      type: object
      properties:
        id:       { type: integer, format: int64 }
        name:     { type: string }
        path:     { type: string }
        icon:     { type: string }
        children: { type: array, items: { $ref: '#/components/schemas/Menu' } }

    ImportReport:
      type: object
      properties:
        status: { type: string, enum: [RUNNING, COMPLETED, COMPLETED_WITH_WARNINGS, FAILED] }
        counts:
          type: object
          description: 各表最终行数，与 docs/03-database.md §5.3 的预期表对照
          properties:
            departments:     { type: integer, example: 111 }
            users:           { type: integer, example: 10000 }
            softwareSystems: { type: integer, example: 18 }
            functionModules: { type: integer, example: 115 }
            resources:       { type: integer, example: 359 }
            permissions:     { type: integer, example: 1795 }
            roles:           { type: integer, example: 7 }
            rolePermissions: { type: integer, example: 1803 }
            userRoles:       { type: integer, example: 10000 }
        warnings: { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }
        errors:   { type: array, items: { $ref: '#/components/schemas/ImportIssue' } }

    ImportIssue:
      type: object
      description: 每条对应 docs/01-srs.md 附录 C 的一个数据疑点
      properties:
        code:
          type: string
          enum: [CELL_VALUE_NORMALIZED, CELL_EMPTY, MANAGER_NAME_AMBIGUOUS, MANAGER_MULTI_DEPT, DEPT_NOT_MATCHED, BRANCH_MISMATCH, HIERARCHY_INVALID]
        location: { type: string, example: 权限清单!行117 }
        detail:   { type: string }

    DashboardMetrics:
      type: object
      properties:
        userCount:        { type: integer, example: 10000 }
        departmentCount:  { type: integer, example: 111 }
        roleCount:        { type: integer, example: 7 }
        permissionCount:  { type: integer, example: 1795 }
        todayAuthzCount:  { type: integer, format: int64 }
        authzSuccessRate: { type: number, format: double }
        qps:              { type: integer }
        p95Millis:        { type: number, format: double }
        p99Millis:        { type: number, format: double }
        cacheHitRate:     { type: number, format: double }
        topDenyReasons:
          type: array
          items:
            type: object
            properties:
              reason: { type: string }
