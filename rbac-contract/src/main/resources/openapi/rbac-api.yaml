  # ---------------------------------------------------------------------------
  # 角色继承（迭代二）
  # ---------------------------------------------------------------------------
  /hierarchy:
    get:
      tags: [hierarchy]
      summary: 全量继承关系（DAG）
      x-iteration: 2
      x-required-permission: system:hier:view
      responses:
        '200':
          description: 继承图
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HierarchyGraph' }
    post:
      tags: [hierarchy]
      summary: 建立继承关系
      description: |
        语义：`child` 继承 `parent`，child 获得 parent 的全部权限。
        例：部门经理(child) 继承 普通员工(parent)。

        成环时返回 23001 并附**完整环路径**——角色上百时管理员无法自行找出环在哪里，
        返回路径使前端可以把构成环的边标红。这要求环检测算法保留遍历栈而非只返回布尔值，
        是设计阶段就要决定、事后补很麻烦的细节。
      x-iteration: 2
      x-required-permission: system:hier:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [childRoleId, parentRoleId]
              properties:
                childRoleId:  { type: integer, format: int64 }
                parentRoleId: { type: integer, format: int64 }
      responses:
        '200':
          description: 建立成功，返回影响面
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HierarchyChangeResult' }
        '409':
          description: 成环 / 自环 / 深度超限 / 重复
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/CycleDetail' }
    delete:
      tags: [hierarchy]
      summary: 解除继承关系
      x-iteration: 2
      x-required-permission: system:hier:manage
      parameters:
        - { name: childRoleId,  in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: parentRoleId, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

