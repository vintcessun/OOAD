      x-iteration: 3
      x-required-permission: system:constraint:manage
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /constraints/scan:
    post:
      tags: [constraint]
      summary: 存量冲突扫描
      description: 对全量用户执行所有启用中的约束，输出违规清单与整改建议。
      x-iteration: 3
      x-required-permission: system:constraint:manage
      responses:
        '200':
          description: 扫描结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LegacyConflicts' }

  /constraints/what-if:
    post:
      tags: [constraint]
      summary: What-if 授权影响分析
      description: |
        在**不落库**的前提下模拟一次角色指派，返回新增/移除权限、触发的约束、风险变化。

        本接口不写任何数据——它完整复用授权内核与约束求值器，只是在内存中构造一个
        假想的用户快照。这正是「内核是无 I/O 纯逻辑」这一架构约束带来的直接收益：
        若判定逻辑与数据库访问纠缠，What-if 就必须写库再回滚，既慢又危险。
      x-iteration: 3
      x-required-permission: system:role:assign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:        { type: integer, format: int64 }
                addRoleIds:    { type: array, items: { type: integer, format: int64 } }
                removeRoleIds: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: 模拟结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/WhatIfResult' }

